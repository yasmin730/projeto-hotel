<!DOCTYPE html>                  
<html lang="pt-br">                
<head>                             
    <meta charset="UTF-8">         
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>consulta de clientes</title>
     
    <link href="https://cdn.jsdelivr.net/bootstrap@5.3.0/dist/css/bootstrap.min.css" rell="stylesheet">

    <link rell="stylesheet" href="/static/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    
</head>
<body>
    
    <div>
        <h2> Alterar Dados do Cliente</h2>
    
        <form type="hidden" id="clienteId">

            <div>
    
                <div>
                    <label>Nome:</label>
                    <input type="text" id="nome" required>
                </div>
    
                <div>
                    <label>CPF:</label>
                    <input type="text" id="cpf" required>
                </div>
    
                <div>
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>
    
                <div>
                    <label>Endereço:</label>
                    <input type="text" id="endereco" required>
                </div>
    
                <div>
                    <label>Observações:</label>
                    <textarea id="observacoes">s</textarea>
                </div>
            </div>
    
            <div>
                <button type="submit"> Salvar Alterações</button>
            </div>
        </form>
        <div id="mensagem"></div>
    </div>
    <header>
        <div id="carouselExampleIndicados" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <!-- Primeira imagem(ativa por padrão)-->
                <div class="carousel-item active">
                    <img src="assets/images/banner1.png" class="d-block w-100" alt="banner 1">
                </div>
                <div class="carousel-item">
                    <img src="assets/images/banner2.png" class="d-block w-100" alt="banner 2">
                </div>
                <div class="carousel-item">
                    <img src="assets/images/banner3.png" class="d-block w-100" alt="banner 3">
                </div>
            </div>
        </div>
    </header>

    <div id="mensagem"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>

    <footer class="text-center mt-5 p-3 text-white bg-dark">
        <p> Sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>
</body>
</html>
