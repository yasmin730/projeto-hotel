<!DOCTYPE html>                  
<html lang="pt-br">                
<head>                             
    <meta charset="UTF-8">         
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>consulta de clientes</title>

    <link rell="stylesheet" href="../static/css/style.css">
    <script src="assets/js/main.js"></script>
    
</head>


<body>
   
   <div>
        <h2>🔍 Consulta de Clientes</h2>
        <div>
            <input type="text" id="campoBusca" placeholder="digite o nome do cliente">
            <button id="btnBuscar">Buscar</button>
        </div>

        <table>
            <thead>
                <tr>
                   <th>ID</th>
                   <th>Nome</th>
                   <th>CPF</th>
                   <th>Email</th>
                   <th>Telefone</th>
                   <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaResultados"></tbody>
        </table>
   </div>
   <header>
        <div id="carouselExampleIndicados" class="carousel slide" data-bs-ride="carousel">
              <div class="carousel-inner">
                <!-- Primeira imagem(ativa por padrão)-->
                 <div class="carousel-item active">
                   <img src="assets/images/banner1.png" class="d-block w-100" alt="banner1">
                </div>
                <div class="carousel-item">
                    <img src="assets/images/banner2.png" class="d-block w-100" alt="banner2">
                </div>
                 <div class="carousel-item">
                   <img src="assets/images/banner3.png" class="d-block w-100" alt="banner3">
                </div>
            </div>
        </div>
    </header>

    <div id="mensagem"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>

    <footer class="text-center mt-5 p-3 text-white bg-dark">
        <p> Sistema de Cadastro | Desenvolvido para fins didáticos</p>
    </footer>

</body>
</html>
