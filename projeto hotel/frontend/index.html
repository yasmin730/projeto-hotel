<!DOCTYPE html>                    <!--DIZ AO COMPILADOR QUE É UM ARQUIVO HTML5-->
<html lang="pt-br">                
<head>                             
    <meta charset="UTF-8">         
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!--RESPONSABILIDADE DO SITE-->
    <title>cadastro de clientes</title>
    
    <link href="https://cdn.jsdelivr.net/bootstrap@5.3.0/dist/css/bootstrap.min.css" rell="stylesheet">

    <link rell="stylesheet" href="/static/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <style>
        /* Apenas um estilo básico para organizar */
        div { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input { width: 100%; max-width: 300px; padding: 5px; }
    </style>
</head>
<body>
    <header>
        <div id="carouselExampleIndicados" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <!-- Primeira imagem(ativa por padrão)-->
                <div class="carousel-item active">
                    <img src="assets/images/banner1.png" class="d-block w-100" alt="banner 1">
                </div>
                <div class="carousel-item">
                    <img src="assets/images/banner2.png" class="d-block w-100" alt="banner 2">
                </div>
                <div class="carousel-item">
                    <img src="assets/images/banner3.png" class="d-block w-100" alt="banner 3">
                </div>
            </div>
        </div>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient">
        <div class="container-fluid">
          <!-- Logotipo / Nome de hotel -->
           <a class="navbar-brand fw-bold text-white" href="/"> Hotel Villa Vistosa</a>
           <!-- Botão que aparece em telas pequenas-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span></span>
             </button>
             <!-- Intens de navegação-->
              <div id="navbarNav">
                <ul>
                    <li>

                        <a href="/"> 🏠 Cadrastro </a>
                    </li>
                    <li>

                        <a href="/consulta">🔍 Consultar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
   
   
    
   <form id="cadastro">
    <div>
        <div>
            <label> nome: </label>
            <input type="text" name="nome" required>
        </div>
    </div>
    <div>
        <div>
            <label> CPF: </label>
            <input type="text" name="cpf" required>
        </div>
    </div>
    <div>
        <div>
            <label> email: </label>
            <input type="email" name="email" required>
        </div>
    </div>
    <div>
        <div>
            <label> telefone: </label>
            <input type="text" name="telefone" required>
        </div>
    </div>
    <div>
        <div>
            <label> endereço: </label>
            <input type="text" name="endereco" required>
        </div>
    </div>
    <div>
        <div>
            <label> observação: </label>
            <input type="text" name="observacao" required>
        </div>
    </div>
  

    <button type="submit" class="btn-primary">Cadastrar</button>
   </form>

   <div id="mensagem"></div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

   <scipt src="assets/js/main.js"></scipt>

   <footer class="text-center mt-5 p-3 text-white bg-dark">
      <p> Sistema de Cadastro | Desenvolvido para fins didáticos</p>
   </footer>

</body>
</html>
